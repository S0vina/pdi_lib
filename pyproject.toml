[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi_lib"
version = "0.1.0"
description = "Biblioteca de Processamento de Imagens e Visão Computacional"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Hillan Alves de Sousa" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["opencv-python>=4.5.0", "numpy>=1.20.0", "matplotlib>=3.3.0"]

[tool.setuptools]
packages = ["src"]
